<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>목록 새로고침 · Ien 디자인 시스템</title>
  <style>
  :root {
    --background: #FFFFFF;
    --surface: #FFFFFF;
    --surface-weak: #F9FAFB;
    --surface-variant: #F2F4F6;
    --text-primary: #191F28;
    --text-secondary: #4E5968;
    --text-disabled: #B0B8C1;
    --border: #E5E8EB;
    --brand: #3182F6;
    --brand-weak: #E8F3FF;
    --font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --ien-motion-easing: cubic-bezier(0.2, 0, 0, 1);
  }
</style>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--surface-weak); color: var(--text-primary); font-family: var(--font-family); }
    button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    .app { position: relative; display: flex; flex-direction: column; width: min(100%, 430px); height: 100dvh; min-height: 560px; margin: 0 auto; overflow: hidden; background: var(--background); }
    .status-bar { flex: none; height: max(24px, env(safe-area-inset-top)); background: var(--background); }
    .topbar { flex: none; display: flex; align-items: center; min-height: 64px; padding: 0 16px; }
    .identity { display: grid; gap: 2px; }
    .eyebrow { margin: 0; color: var(--text-secondary); font-size: 12px; line-height: 16px; letter-spacing: .01em; }
    h1 { margin: 0; font-size: 24px; line-height: 32px; font-weight: 700; letter-spacing: 0; }
    .icon-button { display: grid; place-items: center; width: 44px; height: 44px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--text-primary); }
    .icon-button:hover { background: var(--surface-variant); }
    .icon-button:active { background: var(--brand-weak); color: var(--brand); }
    .icon-button:disabled { background: var(--surface-variant); color: var(--text-disabled); cursor: default; }
    .icon-button svg, .tab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .summary { flex: none; padding: 16px 16px 12px; }
    .summary h2 { margin: 0; font-size: 20px; line-height: 28px; font-weight: 600; letter-spacing: 0; }
    .summary p { margin: 4px 0 0; color: var(--text-secondary); font-size: 14px; line-height: 22px; }
    .refresh-container { position: relative; flex: 1; min-height: 0; overflow: hidden; }
    .refresh-indicator { position: absolute; z-index: 2; top: 8px; left: 50%; width: var(--indicator-width, 36px); height: 36px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); box-shadow: 0 4px 12px color-mix(in srgb, var(--text-primary) 8%, transparent); opacity: 0; transform: translate(-50%, -48px); transition: transform 160ms var(--ien-motion-easing), opacity 160ms var(--ien-motion-easing), width 160ms var(--ien-motion-easing), background 160ms var(--ien-motion-easing); pointer-events: none; }
    .refresh-dot { position: absolute; top: 50%; left: calc(50% + var(--dot-x, 0px)); width: 7px; height: 7px; border-radius: 50%; background: var(--brand); transform: translate(-50%, -50%); }
    .refresh-dot:first-child { --dot-x: calc(0px - var(--dot-spread, 0px)); opacity: var(--pull-progress, 0); }
    .refresh-dot:nth-child(2) { width: 8px; height: 8px; }
    .refresh-dot:last-child { --dot-x: var(--dot-spread, 0px); opacity: var(--pull-progress, 0); }
    .refresh-container[data-state="pulling"] .refresh-indicator { opacity: 1; transform: translate(-50%, calc(-36px + var(--pull-distance, 0px))); transition: none; }
    .refresh-container[data-ready="true"] .refresh-indicator { border-color: var(--brand-weak); background: var(--brand-weak); }
    .refresh-container[data-state="refreshing"] .refresh-indicator { width: 72px; opacity: 1; transform: translate(-50%, 0); }
    .refresh-container[data-state="refreshing"] .refresh-dot { animation: refresh-flow .9s ease-in-out infinite backwards; opacity: 1; }
    .refresh-container[data-state="refreshing"] .refresh-dot:nth-child(2) { animation-delay: .15s; }
    .refresh-container[data-state="refreshing"] .refresh-dot:last-child { animation-delay: .3s; }
    .list-scroll { height: 100%; overflow-y: auto; overscroll-behavior-y: contain; scrollbar-width: none; padding: 0 16px calc(106px + env(safe-area-inset-bottom)); touch-action: pan-y; }
    .list-scroll::-webkit-scrollbar { display: none; }
    .list-inner { transform: translateY(var(--pull-distance, 0px)); transition: transform 160ms var(--ien-motion-easing); }
    .refresh-container[data-state="pulling"] .list-inner { transition: none; }
    .refresh-container[data-state="refreshing"] .list-inner { transform: translateY(56px); }
    .refresh-container[data-state="loading"] .group-label { display: none; }
    .refresh-container[data-state="pulling"] .list-scroll { user-select: none; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .group-label { margin: 20px 0 8px; color: var(--text-secondary); font-size: 13px; line-height: 18px; font-weight: 600; letter-spacing: .01em; }
    .row { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 76px; padding: 12px 0; border: 0; border-bottom: 1px solid var(--border); background: transparent; color: var(--text-primary); text-align: left; }
    .row:hover { background: var(--surface-weak); }
    .row:active { background: var(--surface-variant); }
    .row-icon { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: var(--surface-variant); color: var(--text-secondary); font-size: 15px; font-weight: 600; }
    .row-copy { flex: 1; min-width: 0; display: grid; gap: 3px; }
    .row-title { font-size: 16px; line-height: 24px; font-weight: 600; }
    .row-description { color: var(--text-secondary); font-size: 13px; line-height: 18px; }
    .row-arrow { flex: none; color: var(--text-secondary); font-size: 21px; line-height: 1; }
    .skeleton-row { display: flex; align-items: center; gap: 14px; min-height: 76px; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .skeleton-icon { flex: none; width: 44px; height: 44px; border-radius: 12px; background: var(--surface-variant); }
    .skeleton-copy { flex: 1; display: grid; gap: 9px; }
    .skeleton-line { display: block; height: 12px; border-radius: 999px; background: var(--surface-variant); }
    .skeleton-line:first-child { width: 42%; }
    .skeleton-line:last-child { width: 68%; height: 10px; }
    .skeleton-row:nth-child(2n) .skeleton-line:last-child { width: 54%; }
    .skeleton-row:nth-child(3n) .skeleton-line:first-child { width: 34%; }
    .refresh-container[data-state="loading"] .skeleton-row { animation: skeleton-pulse 1.1s ease-in-out infinite alternate; }
    .tabbar-wrap { position: absolute; z-index: 4; right: 0; bottom: 0; left: 0; padding: 10px 16px max(12px, env(safe-area-inset-bottom)); pointer-events: none; }
    .tabbar { display: grid; grid-template-columns: repeat(3, 1fr); min-height: 66px; padding: 4px; border: 1px solid var(--border); border-radius: 24px; background: color-mix(in srgb, var(--surface) 86%, transparent); box-shadow: 0 4px 12px color-mix(in srgb, var(--text-primary) 8%, transparent); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); pointer-events: auto; }
    .tab { display: grid; justify-items: center; align-content: center; gap: 3px; min-width: 0; min-height: 56px; border: 0; border-radius: 20px; background: transparent; color: var(--text-secondary); font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: .02em; }
    .tab:hover { background: var(--surface-variant); color: var(--text-primary); }
    .tab[aria-selected="true"] { background: var(--brand-weak); color: var(--brand); }
    .tab[aria-selected="true"]:hover { background: var(--brand-weak); color: var(--brand); }
    .tab:active { background: var(--surface-variant); color: var(--text-primary); }
    .tab[aria-selected="true"]:active { background: var(--brand-weak); color: var(--brand); }
    .detail { position: absolute; z-index: 5; inset: 0; display: none; flex-direction: column; background: var(--background); }
    .detail.open { display: flex; }
    .detail-header { display: flex; align-items: center; gap: 8px; padding: max(24px, env(safe-area-inset-top)) 16px 16px; border-bottom: 1px solid var(--border); }
    .detail-header h2 { margin: 0; font-size: 20px; line-height: 28px; }
    .detail-body { padding: 24px 16px; }
    .detail-body p { margin: 0; color: var(--text-secondary); font-size: 15px; line-height: 1.7; }
    @keyframes refresh-flow { 0%, 65%, 100% { transform: translate(-50%, -50%) scale(.72); opacity: .55; } 35% { transform: translate(-50%, calc(-50% - 6px)) scale(1.18); opacity: 1; } }
    @keyframes skeleton-pulse { to { opacity: .48; } }
    @media (min-width: 520px) { .app { height: min(900px, calc(100dvh - 32px)); min-height: 560px; margin: 16px auto; border: 1px solid var(--border); border-radius: 24px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="app" data-od-id="pull-to-refresh-mobile-screen">
    <div class="status-bar" aria-hidden="true"></div>
    <header class="topbar" data-od-id="top-app-bar">
      <div class="identity"><p class="eyebrow">Ien 디자인 시스템</p><h1 id="page-title" data-od-id="page-title">컴포넌트</h1></div>
    </header>
    <section class="summary" data-od-id="list-summary"><h2 id="section-title">구성 요소</h2><p id="section-description">화면에 쓰이는 요소를 살펴보세요.</p></section>
    <main class="refresh-container" id="refresh-container" data-state="idle" aria-labelledby="section-title" data-od-id="refresh-container">
      <div class="refresh-indicator" aria-hidden="true" data-od-id="refresh-indicator"><span class="refresh-dot"></span><span class="refresh-dot"></span><span class="refresh-dot"></span></div>
      <span class="visually-hidden" id="refresh-label" role="status" aria-live="polite"></span>
      <div class="list-scroll" id="list-scroll" data-od-id="scrollable-list"><div class="list-inner" id="list-inner"><h3 class="group-label" id="group-label">전체 구성 요소</h3><div id="list-items"></div></div></div>
    </main>
    <div class="tabbar-wrap"><nav class="tabbar" role="tablist" aria-label="화면 탐색" data-od-id="translucent-tab-bar">
      <button class="tab" type="button" role="tab" aria-selected="true" data-tab="components" data-od-id="tab-components"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg><span>컴포넌트</span></button>
      <button class="tab" type="button" role="tab" aria-selected="false" data-tab="tokens" data-od-id="tab-tokens"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="8" r="4"/><circle cx="16" cy="8" r="4"/><circle cx="8" cy="16" r="4"/><circle cx="16" cy="16" r="4"/></svg><span>토큰</span></button>
      <button class="tab" type="button" role="tab" aria-selected="false" data-tab="guide" data-od-id="tab-guide"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4.5h6a3 3 0 0 1 3 3v12a3 3 0 0 0-3-3H4z"/><path d="M20 4.5h-4a3 3 0 0 0-3 3v12a3 3 0 0 1 3-3h4z"/></svg><span>가이드</span></button>
    </nav></div>
    <section class="detail" id="detail" aria-hidden="true" data-od-id="detail-sheet"><header class="detail-header"><button class="icon-button" type="button" id="detail-back" aria-label="목록으로 돌아가기">←</button><h2 id="detail-title"></h2></header><div class="detail-body"><p id="detail-description"></p></div></section>
  </div>
  <script>
    const sections = {
      components: { title: '컴포넌트', heading: '구성 요소', description: '화면에 쓰이는 요소를 살펴보세요.', group: '전체 구성 요소', items: [
        ['버튼', '주요 행동과 보조 행동', '버'], ['입력 필드', '텍스트 입력과 유효성 상태', '입'], ['탭', '동급 콘텐츠의 전환', '탭'], ['목록', '정보와 행동을 행으로 정리', '목'], ['모달', '중요한 선택과 확인', '모'], ['하단 시트', '맥락을 유지하는 보조 흐름', '시']
      ] },
      tokens: { title: '토큰', heading: '디자인 토큰', description: '일관된 화면을 위한 공통 기준입니다.', group: '핵심 토큰', items: [
        ['색상', '역할에 따라 표면과 강조를 구분', '색'], ['타이포그래피', '읽기 흐름과 정보 위계', '글'], ['간격', '4px 단위의 일관된 리듬', '간'], ['형태', '연속 곡률과 반경 단계', '형']
      ] },
      guide: { title: '가이드', heading: '사용 가이드', description: '화면을 만들 때 확인할 기준입니다.', group: '기본 원칙', items: [
        ['접근성', '조작 영역과 텍스트 대비', '접'], ['상태 표현', '로딩·성공·오류를 명확하게', '상'], ['목록 구성', '행의 위계와 여백', '목'], ['하단 탐색', '콘텐츠를 가리지 않는 배치', '탐']
      ] }
    };
    const container = document.getElementById('refresh-container');
    const scroller = document.getElementById('list-scroll');
    const label = document.getElementById('refresh-label');
    const listItems = document.getElementById('list-items');
    const detail = document.getElementById('detail');
    let activeTab = 'components';
    let refreshTimer = null;
    let startY = null;
    let mouseStartY = null;
    let ignoreNextClick = false;
    let pullDistance = 0;

    function resetPullVisual() {
      pullDistance = 0;
      container.style.setProperty('--pull-distance', '0px');
      container.style.setProperty('--pull-progress', '0');
      container.style.setProperty('--dot-spread', '0px');
      container.style.setProperty('--indicator-width', '36px');
      container.dataset.ready = 'false';
    }

    function renderItems() {
      const section = sections[activeTab];
      listItems.replaceChildren();
      section.items.forEach(([title, description, symbol], index) => {
        const row = document.createElement('button');
        row.type = 'button';
        row.className = 'row';
        row.dataset.odId = `${activeTab}-row-${index + 1}`;
        row.innerHTML = `<span class="row-icon" aria-hidden="true">${symbol}</span><span class="row-copy"><span class="row-title">${title}</span><span class="row-description">${description}</span></span><span class="row-arrow" aria-hidden="true">›</span>`;
        row.addEventListener('click', () => openDetail(title, description));
        listItems.append(row);
      });
    }
    function renderSkeleton() {
      listItems.replaceChildren();
      for (let index = 0; index < 6; index += 1) {
        const row = document.createElement('div');
        row.className = 'skeleton-row';
        row.setAttribute('aria-hidden', 'true');
        row.innerHTML = '<span class="skeleton-icon"></span><span class="skeleton-copy"><span class="skeleton-line"></span><span class="skeleton-line"></span></span>';
        listItems.append(row);
      }
    }
    function paintSection(tab, showLoading = false) {
      const section = sections[tab];
      activeTab = tab;
      document.getElementById('page-title').textContent = section.title;
      document.getElementById('section-title').textContent = section.heading;
      document.getElementById('section-description').textContent = section.description;
      document.getElementById('group-label').textContent = section.group;
      document.querySelectorAll('.tab').forEach(button => button.setAttribute('aria-selected', String(button.dataset.tab === tab)));
      scroller.scrollTop = 0;
      resetPullVisual();
      if (showLoading) {
        renderSkeleton();
        setState('loading');
        refreshTimer = setTimeout(() => { renderItems(); setState('idle'); }, 1100);
      } else {
        renderItems();
        setState('idle');
      }
    }
    function setState(state) {
      container.dataset.state = state;
      container.setAttribute('aria-busy', String(state === 'refreshing' || state === 'loading'));
      label.textContent = state === 'refreshing' ? '현재 목록을 새로고침하는 중' : state === 'loading' ? '목록을 불러오는 중' : state === 'pulling' ? (pullDistance >= 56 ? '놓으면 새로고침' : '아래로 당겨 새로고침') : '';
    }
    function refresh() {
      if (container.dataset.state === 'refreshing' || container.dataset.state === 'loading') return;
      clearTimeout(refreshTimer);
      resetPullVisual();
      container.style.setProperty('--dot-spread', '13px');
      setState('refreshing');
      refreshTimer = setTimeout(() => setState('idle'), 1200);
    }
    function updatePull(delta) {
      pullDistance = Math.min(96, Math.max(0, delta * .65));
      const progress = Math.min(1, pullDistance / 56);
      container.style.setProperty('--pull-distance', `${pullDistance}px`);
      container.style.setProperty('--pull-progress', String(progress));
      container.style.setProperty('--dot-spread', `${progress * 13}px`);
      container.style.setProperty('--indicator-width', `${36 + progress * 36}px`);
      container.dataset.ready = String(pullDistance >= 56);
      if (pullDistance > 0) setState('pulling');
    }
    function finishPull() {
      const shouldRefresh = pullDistance >= 56;
      resetPullVisual();
      if (shouldRefresh) refresh();
      else if (container.dataset.state === 'pulling') setState('idle');
    }
    function openDetail(title, description) {
      document.getElementById('detail-title').textContent = title;
      document.getElementById('detail-description').textContent = description;
      detail.classList.add('open');
      detail.setAttribute('aria-hidden', 'false');
      document.getElementById('detail-back').focus();
    }
    function closeDetail() {
      detail.classList.remove('open');
      detail.setAttribute('aria-hidden', 'true');
    }
    document.querySelectorAll('.tab').forEach(button => button.addEventListener('click', () => { closeDetail(); clearTimeout(refreshTimer); paintSection(button.dataset.tab, true); }));
    document.getElementById('detail-back').addEventListener('click', closeDetail);
    document.addEventListener('keydown', event => { if (event.key === 'Escape' && detail.classList.contains('open')) closeDetail(); });
    scroller.addEventListener('touchstart', event => { if (scroller.scrollTop === 0 && container.dataset.state === 'idle') startY = event.touches[0].clientY; }, { passive: true });
    scroller.addEventListener('touchmove', event => {
      if (startY === null) return;
      const delta = event.touches[0].clientY - startY;
      if (delta <= 0 && pullDistance === 0) return;
      if (event.cancelable) event.preventDefault();
      updatePull(delta);
    }, { passive: false });
    scroller.addEventListener('touchend', () => { if (startY !== null) { startY = null; finishPull(); } });
    scroller.addEventListener('touchcancel', () => { startY = null; resetPullVisual(); if (container.dataset.state === 'pulling') setState('idle'); });
    scroller.addEventListener('pointerdown', event => { if (event.pointerType === 'mouse' && event.button === 0 && scroller.scrollTop === 0 && container.dataset.state === 'idle') mouseStartY = event.clientY; });
    window.addEventListener('pointermove', event => { if (mouseStartY !== null) updatePull(event.clientY - mouseStartY); });
    window.addEventListener('pointerup', () => { if (mouseStartY !== null) { mouseStartY = null; if (pullDistance > 8) { ignoreNextClick = true; setTimeout(() => { ignoreNextClick = false; }, 100); } finishPull(); } });
    scroller.addEventListener('click', event => { if (ignoreNextClick) { event.preventDefault(); event.stopPropagation(); ignoreNextClick = false; } }, true);
    window.setListLoading = loading => { clearTimeout(refreshTimer); if (loading) { renderSkeleton(); setState('loading'); } else { renderItems(); setState('idle'); } };
    window.setListRefreshing = refreshing => { clearTimeout(refreshTimer); resetPullVisual(); if (refreshing) { container.style.setProperty('--dot-spread', '13px'); setState('refreshing'); } else setState('idle'); };
    paintSection(activeTab, true);
  </script>
</body>
</html>
