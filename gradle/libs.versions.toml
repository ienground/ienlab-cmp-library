[versions]
agp = "9.0.0"
kotlin = "2.3.10"
android-minSdk = "29"
android-compileSdk = "36"
android-targetSdk = "36"
lib-version-name = "0.1.3-alpha08"

# plugin
compose-plugin = "1.10.1"
compose-plugin-experimental = "1.10.0-alpha05"
compose-navigation3 = "1.0.0-alpha06"

# firebase
kmp-firebase = "2.4.0"
firebase-firestore = "26.1.0"
firebase-common = "22.0.1"

# ui
activity-compose = "1.12.4"
lifecycle = "2.10.0-alpha08"
backdrop = "2.0.0-alpha03"
haze = "1.7.2"
hig = "0.1.0-alpha10"
capsule = "1.2.0"

# functionality
kdatetime = "1.1.2"
kotlin-coroutine = "1.10.2"
startup-runtime = "1.2.0"
kotlinx-io-core = "0.9.0"

# backend
vanniktechMavenPublish = "0.36.0"

# test
runner = "1.7.0"
coreVersion = "1.7.0"
junit = "1.3.0"
android-ui-graphics = "1.10.3"
androidx-core = "1.17.0"

[libraries]

# firebase
firebase-firestore = { group = "dev.gitlive", name = "firebase-firestore", version.ref = "kmp-firebase" }
firebase-firestore-android = { group = "com.google.firebase", name = "firebase-firestore", version.ref = "firebase-firestore" }
firebase-common-android = { group = "com.google.firebase", name = "firebase-common", version.ref = "firebase-common" }

# ui
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
lifecycle-viewmodel = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
lifecycle-runtime = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

compose-material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "compose-plugin-experimental"}
compose-preview = { group = "org.jetbrains.compose.ui", name = "ui-tooling-preview", version.ref = "compose-plugin" }
compose-ui-tooling = { group = "org.jetbrains.compose.ui", name = "ui-tooling", version.ref = "compose-plugin" }
compose-resources = { group = "org.jetbrains.compose.components", name = "components-resources", version.ref = "compose-plugin" }
compose-navigation3 = { group = "org.jetbrains.androidx.navigation3", name = "navigation3-ui", version.ref = "compose-navigation3" }

backdrop = { group = "io.github.kyant0", name = "backdrop", version.ref = "backdrop"}
haze = { group = "dev.chrisbanes.haze", name = "haze", version.ref = "haze" }

hig-core = { group = "zone.ien.hig", name = "hig-core", version.ref = "hig" }
hig = { group = "zone.ien.hig", name = "hig", version.ref = "hig"}
hig-adaptive = { group = "zone.ien.hig", name = "hig-adaptive", version.ref = "hig" }
hig-icons = { group = "zone.ien.hig", name = "hig-icons-extended", version.ref = "hig" }
capsule = { group = "io.github.kyant0", name = "shapes", version.ref = "capsule"}

# functionality
kdatetime = { group = "io.github.sunny-chung", name = "kdatetime-multiplatform", version.ref = "kdatetime" }
kotlin-coroutine = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlin-coroutine" }
startup-runtime = { group = "androidx.startup", name = "startup-runtime", version.ref = "startup-runtime" } # android only
kotlinx-io-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-io-core", version.ref = "kotlinx-io-core" }
android-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics", version.ref = "android-ui-graphics" } # android only
androidx-core = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core"} # android only


# test
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
runner = { group = "androidx.test", name = "runner", version.ref = "runner" }
core = { group = "androidx.test", name = "core", version.ref = "coreVersion" }
junit = { group = "androidx.test.ext", name = "junit", version.ref = "junit" }

[bundles]
hig = ["hig-core", "hig", "hig-adaptive", "hig-icons"]

[plugins]
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-application = { id = "com.android.application" }
android-library = { id = "com.android.library" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-plugin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktechMavenPublish" }
android-lint = { id = "com.android.lint", version.ref = "agp" }
