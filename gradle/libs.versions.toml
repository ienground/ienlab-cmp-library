[versions]
agp = "8.11.1"
kotlin = "2.2.21"
android-minSdk = "29"
android-compileSdk = "36"
android-targetSdk = "36"
lib-version-name = "0.1.0-alpha01"

# plugin
compose-plugin = "1.10.0-rc02"
compose-plugin-experimental = "1.10.0-alpha05"

# firebase
kmp-firebase = "2.1.0"

# ui
activity-compose = "1.12.2"
lifecycle = "2.10.0-alpha07"
backdrop = "0.0.1-alpha02"

# functionality
kdatetime = "1.1.2"

# backend
vanniktechMavenPublish = "0.35.0"

# test
runner = "1.7.0"
coreVersion = "1.7.0"
junit = "1.3.0"
kotlinStdlib = "2.2.21"
android-ui-graphics = "1.10.0"

[libraries]

# firebase
firebase-firestore = { group = "dev.gitlive", name = "firebase-firestore", version.ref = "kmp-firebase" }

# ui
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

compose-material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "compose-plugin-experimental"}
compose-preview = { group = "org.jetbrains.compose.ui", name = "ui-tooling-preview", version.ref = "compose-plugin" }
compose-resources = { group = "org.jetbrains.compose.components", name = "components-resources", version.ref = "compose-plugin" }

backdrop = { group = "zone.ien.backdrop", name = "backdrop", version.ref = "backdrop"}

# functionality
kdatetime = { module = "io.github.sunny-chung:kdatetime-multiplatform", version.ref = "kdatetime" }

# test
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
runner = { group = "androidx.test", name = "runner", version.ref = "runner" }
core = { group = "androidx.test", name = "core", version.ref = "coreVersion" }
junit = { group = "androidx.test.ext", name = "junit", version.ref = "junit" }
android-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics", version.ref = "android-ui-graphics" } # android only

[plugins]
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-application = { id = "com.android.application" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-plugin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktechMavenPublish" }
android-lint = { id = "com.android.lint", version.ref = "agp" }
