# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: iosSimulatorArm64Test
            os: xcode-27
          - target: ":cmp-ui-docs:compileKotlinWasmJs"
            os: ubuntu-latest
          - target: testAndroidHostTest
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Xcode 27.1 설정
      if: runner.os == 'macOS'
      run: |
        sudo xcode-select --switch /Applications/Xcode_27.1.app/Contents/Developer
        xcodebuild -version
        xcrun --sdk iphoneos --show-sdk-version
        xcrun --sdk iphonesimulator --show-sdk-version
    - name: iOS 시뮬레이터 준비
      if: matrix.target == 'iosSimulatorArm64Test' && runner.os == 'macOS'
      timeout-minutes: 5
      shell: bash
      run: |
        set -euo pipefail
        simulator_json="$(xcrun simctl list devices available -j | jq -c '
          [
            .devices
            | to_entries[]
            | select(.key | contains(".iOS-"))
            | .value[]
            | select(.deviceTypeIdentifier | contains(".iPhone-"))
            | select(.state == "Booted" or .state == "Shutdown")
          ]
          | sort_by(if .state == "Booted" then 0 else 1 end)
          | .[0] // empty
        ')"
        if [[ -z "$simulator_json" ]]; then
          echo "::error::사용 가능한 iOS iPhone 시뮬레이터(부팅 또는 종료 상태)를 찾지 못했습니다."
          xcrun simctl list devices available
          exit 1
        fi
        simulator_udid="$(jq -r '.udid' <<< "$simulator_json")"
        simulator_state="$(jq -r '.state' <<< "$simulator_json")"
        simulator_name="$(jq -r '.name' <<< "$simulator_json")"
        echo "선택한 iPhone 시뮬레이터: $simulator_name ($simulator_udid, $simulator_state)"
        if [[ "$simulator_state" == "Shutdown" ]]; then
          xcrun simctl boot "$simulator_udid"
        fi
        xcrun simctl bootstatus "$simulator_udid" -b
        echo "CI_IOS_SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"
    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v4
    - uses: actions/cache@v4
      with:
        path: |
          ~/.konan
        key: ${{ runner.os }}-${{ hashFiles('**/.lock') }}
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Build with Gradle
      uses: gradle/gradle-build-action@ce999babab2de1c4b649dc15f0ee67e6246c994f
      with:
        arguments: ${{ matrix.target }}
