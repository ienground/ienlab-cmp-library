name: Deploy UI Documentation

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/pages.yml"
      - ".firebaserc"
      - "firebase.json"
      - "cmp-ui-docs/**"
      - "cmp-ui/**"
      - "cmp-icon/**"
      - "cmp-common/**"
      - "cmp-adaptive/**"
      - "example/composeApp/src/commonMain/kotlin/zone/ien/utils/example/ui/screens/designsystem/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/pages.yml"
      - ".firebaserc"
      - "firebase.json"
      - "cmp-ui-docs/**"
      - "cmp-ui/**"
      - "cmp-icon/**"
      - "cmp-common/**"
      - "cmp-adaptive/**"
      - "example/composeApp/src/commonMain/kotlin/zone/ien/utils/example/ui/screens/designsystem/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
  workflow_dispatch:

permissions:
  checks: write
  contents: read
  pull-requests: write

concurrency:
  group: ui-documentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    name: Build and deploy UI documentation
    runs-on: ubuntu-latest
    if: >-
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmp-ui-docs/package-lock.json

      - name: Build Compose preview
        run: ./gradlew :cmp-ui-docs:wasmJsBrowserDistribution --no-configuration-cache

      - name: Build React documentation
        run: |
          npm ci --prefix cmp-ui-docs
          npm run build:site --prefix cmp-ui-docs

      - name: Deploy to Firebase Hosting
        if: github.event_name != 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IENLAB_IENGROUND }}
          projectId: ienlab-ienground
          target: cmp-ui-docs
          channelId: live

      - name: Deploy pull request preview
        if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IENLAB_IENGROUND }}
          projectId: ienlab-ienground
          target: cmp-ui-docs
          expires: 4h
