name: Build UI Documentation

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/pages.yml"
      - "firebase.json"
      - "cmp-ui-docs/**"
      - "cmp-ui/**"
      - "cmp-icon/**"
      - "cmp-common/**"
      - "cmp-adaptive/**"
      - "example/composeApp/src/commonMain/kotlin/zone/ien/utils/example/ui/screens/designsystem/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-documentation
  cancel-in-progress: true

jobs:
  build:
    name: Build React docs and Compose previews
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmp-ui-docs/package-lock.json

      - name: Build Compose preview
        run: ./gradlew :cmp-ui-docs:wasmJsBrowserDistribution --no-configuration-cache

      - name: Build React documentation
        run: |
          npm ci --prefix cmp-ui-docs
          npm run build:site --prefix cmp-ui-docs

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-documentation
          path: cmp-ui-docs/build/site
